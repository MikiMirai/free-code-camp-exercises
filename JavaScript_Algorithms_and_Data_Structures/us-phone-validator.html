<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./us-phone-validator.css">
  <title>US Phone Number Validator</title>
</head>

  <body>
    <main class="container">
      <h1>Telephone Number Validator</h1>
      <form>
        <fieldset>
          <label for="user-input">Enter a number: </label>
          <input type="text" id="user-input">
          <div id="buttons">
<button type="button" id="check-btn">Check</button>
          <button type="button" id="clear-btn">Clear</button>
          </div>
        </fieldset>
      </form>
      <div id="results-div" class="output hidden"></div>
    </main>
    <script src="./us-phone-validator.js"></script>
  </body>
</html>
