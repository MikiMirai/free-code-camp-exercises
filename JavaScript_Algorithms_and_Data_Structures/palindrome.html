<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./palindrome.css">
    <title>RPG - Dragon Repeller</title>
</head>

<body>
    <main class="container">
        <h1 class="title">Is it a Palindrome?</h1>
        <div class="palindrome-checker">
            <label for="text-input">Enter a word to check for a palindrome:
            </label>
            <input class="palindrome-input" id="text-input" type="text"></input>
            <button class="palindrome-check-btn" id="check-btn">Check</button>
            <div class="results-div hidden" id="result"></div>
        </div>
        <div class="palindrome-definition-div">
            <p class="palindrome-definition">
                <span role="img" aria-label="light-bulb">💡</span>
                A palindrome is a word or sentence that's spelled the same
                way both forward and backward, ignoring punctuation, case, and
                spacing.
            </p>
        </div>
        <script src="./script.js"></script>
    </main>
</body>

</html>
